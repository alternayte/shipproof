version: 2

project_name: shipproof

builds:
  - id: shipproof
    main: ./cmd/shipproof
    binary: shipproof
    ldflags:
      - -s -w
      - -X github.com/alternayte/shipproof/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  # The name carries no version. A version in the name breaks the documented
  # one-line install, because `releases/latest/download/<name>` needs a name
  # that does not change between releases.
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: alternayte
    name: shipproof
