name: evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Keyless Sigstore reads the workload identity from this token.
  id-token: write
  pull-requests: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          # ShipProof has no third-party dependency, so there is no go.sum
          # to key a module cache on.
          cache: false
      - uses: ./action
        with:
          version: source
